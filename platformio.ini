[platformio]
default_envs = sdk11m_led_test

[env]
platform = ststm32@20.0.0
board = sdk11m_427
framework = stm32cube
upload_protocol = sdk11m_ftdi
debug_tool = sdk11m_ftdi
debug_speed = 1000

[env:sdk11m_led_test]
build_src_filter =
    +<platform/>
    +<drivers/>
    +<apps/led_test/>

[env:sdk11m_lab1_v3]
build_src_filter =
    +<platform/>
    +<drivers/>
    +<apps/lab1_v3/>
