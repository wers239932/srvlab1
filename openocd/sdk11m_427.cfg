# SDK-1.1M onboard FTDI JTAG debugger (DBG USB).
# Syntax is for PlatformIO tool-openocd 3.1200.7 / OpenOCD 0.12.x.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi layout_init 0x0408 0x0ffb
ftdi layout_signal nSRST -oe 0x0800
ftdi tdo_sample_edge falling

adapter speed 1000
transport select jtag

set WORKAREASIZE 0x8000
set CHIPNAME STM32F427VITx
set BOARDNAME SDK1_1M
reset_config srst_only
set CONNECT_UNDER_RESET 1

source [find target/stm32f4x.cfg]
